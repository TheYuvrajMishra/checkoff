name: Build CheckOff APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  # Versioning: versionCode = run number, version name = 1.0.<run number>.
  APP_VERSION_CODE: ${{ github.run_number }}
  APP_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Patch Gradle node exec scripts
        # Several Gradle scripts run `node` during configuration via
        # providers.exec, which fails in CI. Use hardcoded paths instead.
        run: python3 scripts/patch-gradle-node-exec.py

      - name: Inject version (run number)
        run: |
          python3 - <<'PYEOF'
          import json, os
          run = os.environ.get('GITHUB_RUN_NUMBER', '1')
          p = 'app.json'
          d = json.load(open(p))
          d['expo']['version'] = f'1.0.{run}'
          d['expo']['android']['versionCode'] = int(run)
          d['expo']['ios']['buildNumber'] = str(run)
          json.dump(d, open(p, 'w'), indent=2)
          open(p, 'a').write('\n')
          print(f"version=1.0.{run} versionCode={run}")
          PYEOF

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Configure release signing
        run: |
          # Decode the release keystore from the repo secret (never committed).
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/checkoff-release.keystore
          # Point the release build type at the release keystore via gradle.properties.
          {
            echo "CHECKOFF_STORE_FILE=checkoff-release.keystore"
            echo "CHECKOFF_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "CHECKOFF_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "CHECKOFF_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> android/gradle.properties
          # Patch build.gradle to use the release signing config.
          python3 scripts/patch-release-signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Diagnose Gradle node commands
        run: |
          cd android
          echo "=== resolveAppEntry ==="
          node -e "require('expo/scripts/resolveAppEntry')" .. android absolute || echo "FAILED: resolveAppEntry"
          echo "=== react-native ==="
          node --print "require.resolve('react-native/package.json')" || echo "FAILED: react-native"
          echo "=== expo cli ==="
          node --print "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })" || echo "FAILED: expo cli"
          echo "=== expo-constants (from its android dir) ==="
          cd ../node_modules/expo-constants/android
          node -e "console.log(require('path').dirname(require.resolve('expo-constants/package.json')));" || echo "FAILED: expo-constants"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK (arm64 only)
        run: |
          # Wrap node to log all invocations (debug the Gradle node failure)
          REAL_NODE=$(which node)
          printf '#!/bin/bash\necho "NODE: $@" >> /tmp/node-calls.log\necho "NODE_CWD: $(pwd)" >> /tmp/node-calls.log\nexec '"$REAL_NODE"' "$@"\n' > /tmp/node
          chmod +x /tmp/node
          export PATH="/tmp:$PATH"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a || true
          echo "=== NODE CALLS ==="
          cat /tmp/node-calls.log || echo "no log"

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk checkoff.apk
          ls -lh checkoff.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheckOff-APK
          path: checkoff.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CheckOff v1.0.${{ github.run_number }}
          files: checkoff.apk
          make_latest: true
