name: Build CheckOff APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  # Versioning: versionCode = run number, version name = 1.0.<run number>.
  APP_VERSION_CODE: ${{ github.run_number }}
  APP_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Configure release signing
        run: |
          # Decode the release keystore from the repo secret (never committed).
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/checkoff-release.keystore
          # Point the release build type at the release keystore via gradle.properties.
          {
            echo "CHECKOFF_STORE_FILE=checkoff-release.keystore"
            echo "CHECKOFF_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "CHECKOFF_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "CHECKOFF_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> android/gradle.properties
          # Patch build.gradle to use the release signing config.
          python3 scripts/patch-release-signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK (arm64 only)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk checkoff.apk
          ls -lh checkoff.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheckOff-APK
          path: checkoff.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CheckOff v1.0.${{ github.run_number }}
          files: checkoff.apk
          make_latest: true
